{% extends 'base.html' %}
{% block content %}
<div class="page-heading">
  <div>
    <p class="eyebrow">BẢO MẬT TÀI KHOẢN</p>
    <h1>Đổi mật khẩu</h1>
  </div>
</div>
<p class="notice info">Nhập mật khẩu hiện tại để đặt mật khẩu mới. Sau khi đổi, các phiên đăng nhập khác sẽ cần đăng nhập lại.</p>
<section class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% include 'includes/fields.html' %}
      <div class="form-actions">
        <button class="button primary">Đổi mật khẩu</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
